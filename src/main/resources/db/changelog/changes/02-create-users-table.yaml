databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: rmaksym1
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address
                  type: varchar(255)
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - insert:
            tableName: users
            columns:
              - column: { name: email, value: "admin" }
              - column: { name: password, value: "$2a$10$59vPwc8ok425plSgCJQLC.CGsL/tPtaZBj04v0b3i/EREfqHaEkH2" }
              - column: { name: first_name, value: "admin" }
              - column: { name: last_name, value: "admin" }