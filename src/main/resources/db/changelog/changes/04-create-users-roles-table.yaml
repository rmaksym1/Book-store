databaseChangeLog:
  - changeSet:
      id: create-users-roles-table
      author: rmaksym1
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    references: users(id)
                    foreignKeyName: fk_users_roles_user
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    references: roles(id)
                    foreignKeyName: fk_users_roles_role
        - insert:
            tableName: users_roles
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: role_id, valueNumeric: 1 }
        - insert:
            tableName: users_roles
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: role_id, valueNumeric: 2 }